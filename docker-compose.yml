services:
  selenium-hub:
    image: selenium/hub:4.51.0
    ports:
      - "4444:4444"
    environment:
      SE_SESSION_REQUEST_TIMEOUT: "60"
      SE_SESSION_RETRY_INTERVAL: "1"

  chrome:
    image: selenium/node-chrome:4.51.0
    shm_size: 2gb
    depends_on:
      - selenium-hub
    environment:
      SE_EVENT_BUS_HOST: selenium-hub
      SE_EVENT_BUS_PUBLISH_PORT: "4442"
      SE_EVENT_BUS_SUBSCRIBE_PORT: "4443"
      SE_NODE_MAX_SESSIONS: "1"

  firefox:
    image: selenium/node-firefox:4.51.0
    shm_size: 2gb
    depends_on:
      - selenium-hub
    environment:
      SE_EVENT_BUS_HOST: selenium-hub
      SE_EVENT_BUS_PUBLISH_PORT: "4442"
      SE_EVENT_BUS_SUBSCRIBE_PORT: "4443"
      SE_NODE_MAX_SESSIONS: "1"